version: 2

models:
  - name: stg_yellow_tripdata
    description: "Cleaned, typed staging model for NYC Yellow Taxi trip records."
    columns:
      - name: vendor_id
        description: "Code indicating the TPEP provider."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 6, 7]
      - name: pickup_datetime
        description: "Timestamp when the meter was engaged."
        tests:
          - not_null
      - name: dropoff_datetime
        description: "Timestamp when the meter was disengaged."
        tests:
          - not_null
      - name: passenger_count
        description: "Number of passengers in the vehicle."
      - name: trip_distance
        description: "Trip distance in miles."
      - name: total_amount
        description: "Total amount charged to passengers."